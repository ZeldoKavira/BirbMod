<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0b0d14">
<title>Birb Remote</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cellipse cx='30' cy='38' rx='20' ry='16' fill='%2394a3b8'/%3E%3Ccircle cx='44' cy='24' r='11' fill='%2394a3b8'/%3E%3Ccircle cx='47' cy='22' r='2.5' fill='%23111'/%3E%3Cpath d='M54 25l8 3-8 2z' fill='%23facc15'/%3E%3C/svg%3E">
<style>
  :root { --bg: #0b0d14; --bar: #141826; --line: #2a3150; --text: #e5e7eb; --dim: #8b93a7; --accent: #facc15; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 14px system-ui, -apple-system, Segoe UI, Roboto, sans-serif; overflow: hidden; }
  #wrap { position: fixed; inset: 0 0 calc(46px + env(safe-area-inset-bottom)) 0; display: flex; align-items: center; justify-content: center; }
  #view { max-width: 100%; max-height: 100%; touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; image-rendering: auto; display: none; }
  #msg { position: absolute; color: var(--dim); text-align: center; padding: 16px; }
  #bar { position: fixed; left: 0; right: 0; bottom: 0; height: calc(46px + env(safe-area-inset-bottom)); padding: 6px 8px env(safe-area-inset-bottom);
         background: var(--bar); border-top: 1px solid var(--line); display: flex; gap: 6px; align-items: center; overflow-x: auto; }
  #bar button { flex: none; background: #1c2235; color: var(--text); border: 1px solid var(--line); border-radius: 7px; padding: 6px 10px; font: inherit; }
  #bar button:active { background: #283050; }
  #bar .spacer { flex: 1; }
  #stat { flex: none; color: var(--dim); font-size: 12px; font-variant-numeric: tabular-nums; }
  #dot { flex: none; width: 9px; height: 9px; border-radius: 50%; background: #ef4444; }
  #dot.on { background: #22c55e; }
  #login { display: none; position: absolute; max-width: 360px; width: calc(100% - 32px); background: var(--bar); border: 1px solid var(--line); border-radius: 12px; padding: 16px; }
  #login input { width: 100%; margin: 8px 0; padding: 9px 10px; border-radius: 8px; border: 1px solid var(--line); background: #0f1320; color: var(--text); font: inherit; }
  #login button { padding: 8px 14px; border-radius: 8px; border: 1px solid var(--line); background: #283050; color: var(--text); font: inherit; }
</style>
</head>
<body>
<div id="wrap">
  <img id="view" alt="Birb" draggable="false">
  <div id="msg">Connecting to Birb...</div>
  <div id="login">
    <b>Access token</b>
    <div style="color:var(--dim);font-size:13px;margin-top:4px">Open the link the Birb launcher printed, or paste its token here.</div>
    <input id="tokenIn" autocomplete="off" placeholder="token">
    <button id="tokenGo">Connect</button>
  </div>
</div>
<div id="bar">
  <span id="dot"></span>
  <button data-key="Tab">Tab</button>
  <button data-key="Escape">Esc</button>
  <button data-key=" ">Space</button>
  <button data-key="F9">Meter</button>
  <button data-key="F10">Mods</button>
  <span class="spacer"></span>
  <span id="stat"></span>
</div>
<script>
(() => {
  'use strict';
  const $ = id => document.getElementById(id);
  const view = $('view'), msg = $('msg');

  // ---- token: from the link (?t=), remembered for next time ----
  const params = new URLSearchParams(location.search);
  let token = params.get('t') || '';
  try {
    if (token) localStorage.setItem('birb_remote_token', token);
    else token = localStorage.getItem('birb_remote_token') || '';
  } catch (e) { /* private mode: keep it in memory */ }
  if (params.get('t')) history.replaceState(null, '', location.pathname);

  function needToken() {
    msg.style.display = 'none';
    $('login').style.display = 'block';
  }
  $('tokenGo').onclick = () => {
    token = $('tokenIn').value.trim().replace(/^.*[?&]t=/, '');
    try { localStorage.setItem('birb_remote_token', token); } catch (e) { /* fine */ }
    location.reload();
  };
  if (!token) { needToken(); return; }

  // ---- frames: long-poll the next one, show it ----
  let frameId = 0, cssW = 1, cssH = 1, frames = 0, shownUrl = null, online = false;
  function setOnline(on) {
    online = on;
    $('dot').classList.toggle('on', on);
  }
  async function frameLoop() {
    while (true) {
      try {
        const r = await fetch(`/frame?after=${frameId}`, { headers: { 'X-Token': token }, cache: 'no-store' });
        if (r.status === 401) { needToken(); return; }
        if (!r.ok) throw new Error(await r.text());
        frameId = Number(r.headers.get('X-Frame-Id')) || frameId;
        cssW = Number(r.headers.get('X-Css-W')) || cssW;
        cssH = Number(r.headers.get('X-Css-H')) || cssH;
        const url = URL.createObjectURL(await r.blob());
        await new Promise(res => { view.onload = view.onerror = res; view.src = url; });
        if (shownUrl) URL.revokeObjectURL(shownUrl);
        shownUrl = url;
        view.style.display = 'block';
        msg.style.display = 'none';
        frames++;
        setOnline(true);
      } catch (e) {
        setOnline(false);
        msg.textContent = 'Waiting for Birb... (is the launcher running?)';
        msg.style.display = view.style.display === 'block' ? 'none' : 'block';
        await new Promise(res => setTimeout(res, 1500));
      }
    }
  }
  setInterval(() => { $('stat').textContent = online ? `${frames} fps` : 'offline'; frames = 0; }, 1000);
  frameLoop();

  // ---- input: frame fractions; the launcher turns them into page coordinates ----
  const send = body => fetch('/input', {
    method: 'POST', headers: { 'X-Token': token, 'Content-Type': 'application/json' }, body: JSON.stringify(body),
  }).catch(() => {});

  function at(clientX, clientY) {
    const r = view.getBoundingClientRect();
    return { x: Math.min(1, Math.max(0, (clientX - r.left) / r.width)), y: Math.min(1, Math.max(0, (clientY - r.top) / r.height)) };
  }

  // One finger: press, drag, release - the game sees a mouse. Two fingers: scroll (mouse wheel).
  let pointerId = null, lastMove = 0, twoFinger = null, queue = Promise.resolve();
  const inOrder = body => { queue = queue.then(() => send(body)); };

  view.addEventListener('pointerdown', e => {
    e.preventDefault();
    if (twoFinger || pointerId !== null) return;
    pointerId = e.pointerId;
    view.setPointerCapture(e.pointerId);
    inOrder({ type: 'down', ...at(e.clientX, e.clientY) });
  });
  view.addEventListener('pointermove', e => {
    if (e.pointerId !== pointerId || twoFinger) return;
    const now = performance.now();
    if (now - lastMove < 40) return; // ~25 moves a second is plenty
    lastMove = now;
    inOrder({ type: 'move', ...at(e.clientX, e.clientY) });
  });
  const end = e => {
    if (e.pointerId !== pointerId) return;
    pointerId = null;
    inOrder({ type: 'up', ...at(e.clientX, e.clientY) });
  };
  view.addEventListener('pointerup', end);
  view.addEventListener('pointercancel', end);

  view.addEventListener('touchstart', e => {
    if (e.touches.length === 2) {
      if (pointerId !== null) { inOrder({ type: 'up', x: 0, y: 0 }); pointerId = null; }
      const y = (e.touches[0].clientY + e.touches[1].clientY) / 2, x = (e.touches[0].clientX + e.touches[1].clientX) / 2;
      twoFinger = { x, y };
    }
  }, { passive: true });
  view.addEventListener('touchmove', e => {
    if (!twoFinger || e.touches.length < 2) return;
    const y = (e.touches[0].clientY + e.touches[1].clientY) / 2;
    const dy = twoFinger.y - y;
    if (Math.abs(dy) < 8) return;
    twoFinger.y = y;
    inOrder({ type: 'wheel', dy: dy * 3, ...at(twoFinger.x, y) });
  }, { passive: true });
  view.addEventListener('touchend', e => { if (e.touches.length === 0) twoFinger = null; }, { passive: true });

  // Desktop browsers: wheel scrolls the game too.
  view.addEventListener('wheel', e => { e.preventDefault(); inOrder({ type: 'wheel', dy: e.deltaY, ...at(e.clientX, e.clientY) }); }, { passive: false });
  view.addEventListener('contextmenu', e => e.preventDefault());

  for (const b of document.querySelectorAll('[data-key]'))
    b.addEventListener('click', () => inOrder({ type: 'key', key: b.dataset.key }));
})();
</script>
</body>
</html>
